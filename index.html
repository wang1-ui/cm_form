<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --border: rgba(255,255,255,0.07);
      --wifi: #00d4ff;
      --elec: #ffd600;
      --sim: #a78bfa;
      --text: #f0f4ff;
      --muted: #6b7280;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(167,139,250,0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: drift 15s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    .header {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeUp 0.7s ease both;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--wifi), var(--sim));
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 0 32px rgba(0,212,255,0.3);
    }

    .logo-mark svg { width: 28px; height: 28px; fill: #fff; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--wifi) 0%, #fff 50%, var(--sim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 300;
    }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 200px;
      padding: 36px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1),
                  border-color 0.3s ease,
                  box-shadow 0.3s ease;
      animation: fadeUp 0.7s ease both;
    }

    .card:nth-child(1) { animation-delay: 0.1s; --accent: var(--wifi); }
    .card:nth-child(2) { animation-delay: 0.2s; --accent: var(--elec); }
    .card:nth-child(3) { animation-delay: 0.3s; --accent: var(--sim); }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--accent), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .card:hover::before { opacity: 0.12; }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px var(--accent), 0 0 40px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, box-shadow 0.3s;
      position: relative;
      z-index: 1;
    }

    .card:hover .icon-wrap {
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent);
    }

    .icon-wrap svg {
      width: 34px;
      height: 34px;
      fill: var(--accent);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }

    .card:hover .icon-wrap svg { transform: scale(1.15); }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
    }

    .card-desc {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .card-cta {
      margin-top: 4px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
      position: relative;
      z-index: 1;
    }

    .card:hover .card-cta {
      opacity: 1;
      transform: translateY(0);
    }

    .card-cta svg { width: 14px; height: 14px; fill: var(--accent); }

    .footer {
      margin-top: 52px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      animation: fadeUp 0.7s 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 680px) {
      .cards { flex-direction: column; align-items: center; }
      .card  { width: 280px; flex-direction: row; padding: 24px 28px; gap: 20px; }
      .card-desc, .card-cta { display: none; }
      .card-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-mark">
        <img src="logo.PNG" alt="Logo" style="width:40px; height:40px; object-fit:contain;" />
      </div>
    <h1>株式会社CM</h1>

      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.9 7.4C4.6 4.7 8.1 3 12 3s7.4 1.7 10.1 4.4l-2 2C17.9 7.2 15.1 6 12 6S6.1 7.2 4 9.4l-2.1-2zm4 4C7.6 9.6 9.7 8.5 12 8.5s4.4 1.1 6.1 2.9l-2 2C14.9 12.1 13.5 11.5 12 11.5s-2.9.6-4.1 1.9l-2-2zm4 4c.6-.6 1.3-.9 2.1-.9s1.5.3 2.1.9l-2.1 2.1L10 15.4z"/>

      </div>

      </span>

    <!-- Electricity Card -->
    <a class="card" href="https://forms.gle/a4qY9fB5P9icbKn67" target="_blank" rel="noopener">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
        </svg>
      </div>
      <span class="card-title">Electricity</span>
      <span class="card-desc">Power supply & electrical service requests</span>
      <span class="card-cta">
        Open Form
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </span>

    <!-- SIM Card -->
    <a class="card" href="https://forms.gle/KRmMRLA9bQb5Mtqi8" target="_blank" rel="noopener">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 2H9.83L4 7.83V20c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3H8V8h3V5h2v3h3v2z"/>
        </svg>
      </div>
      <span class="card-title">SIM</span>

      <span class="card-cta">

        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>

  </div>

  <p class="footer">© 2026 Service Portal &nbsp;·&nbsp; All rights reserved.&nbsp;@wang</p>

</body>
</html>
